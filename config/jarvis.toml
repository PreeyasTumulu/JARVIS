# Jarvis default configuration (committed).
# Put your own changes in config/local.toml, which is gitignored and overrides these values.
# Secrets never go here. They go in .env (see .env.example).

[agent]
max_iterations = 6           # model calls per command before giving up
turn_timeout_s = 180         # hard ceiling for one command (a first WhatsApp Web load is slow)
tool_timeout_s = 20          # default per tool call, tools can override
max_tool_calls_per_step = 4  # parallel tool calls accepted from one model reply
history_turns = 8            # past commands kept in the conversation
max_tool_result_chars = 4000 # tool output is truncated to this before the model sees it

[llm]
default = "local"

[llm.providers.local]
base_url = "http://localhost:11434/v1"
model = "jarvis-hermes3"     # created from config/ollama/hermes3-8b.Modelfile
temperature = 0.2
timeout_s = 120

# Free cloud models for heavy questions that touch only public data (ADR-045). Private content
# (files, messages, notifications, clipboard, screen, memory) never goes to them.
[llm.providers.groq]
base_url = "https://api.groq.com/openai/v1"
model = "openai/gpt-oss-120b"
api_key_env = "GROQ_API_KEY"   # free account at console.groq.com, no card
temperature = 0.3
timeout_s = 30
max_tokens = 2000              # it reasons before answering; the reply itself stays short

[llm.providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
model = "nvidia/nemotron-3-ultra-550b-a55b:free"
api_key_env = "OPENROUTER_API_KEY"  # free account at openrouter.ai; free models change, see docs
temperature = 0.3
timeout_s = 45
max_tokens = 2000

[router]
cloud = ["groq", "openrouter"]  # tried in order; then the local model. [] keeps everything local
escalate = "auto"            # "auto": "think harder" or a heavy public question; "explicit"; "never"
cooldown_s = 300             # a provider that failed or hit its limit is skipped this long

[router.daily_requests]
groq = 900                   # its free tier allows 1,000 a day for gpt-oss-120b
openrouter = 45              # free accounts get 50 a day

[safety]
# Apps that open without asking. Others follow unlisted_apps.
app_allowlist = [
    "Notepad",
    "Calculator",
    "Visual Studio Code",
    "Docker Desktop",
    "Claude",
    "WhatsApp",
    "Google Chrome",
    "Microsoft Edge",
    "File Explorer",
    "Settings",
]
unlisted_apps = "confirm"    # "confirm" or "block"
confirm_timeout_s = 30       # no answer within this time means no
# Apps that close without asking, unless a window title shows unsaved changes.
safe_to_close = ["Calculator", "Settings", "File Explorer"]
# Apps where click, type_text, and press_keys run without asking. Targets that look destructive
# (Send, Delete, Buy, Alt+F4, ...) still ask. WhatsApp and terminals always ask, whatever this says.
trusted_ui_apps = ["Notepad"]

[safety.tool_risk_overrides]
# Raise a tool's risk level, for example: open_app = "confirm"
# Values below a tool's built-in floor are ignored, so this can only tighten.

[apps]
match_threshold = 75         # 0 to 100, minimum fuzzy match score for an app name

[apps.process_names]
# Executable behind an app, used to find its open windows when the index does not know it.
"File Explorer" = "explorer"
"Visual Studio Code" = "Code"
"Google Chrome" = "chrome"
"Microsoft Edge" = "msedge"
"Brave" = "brave"

[apps.aliases]
"vs code" = "Visual Studio Code"
"vscode" = "Visual Studio Code"
"code" = "Visual Studio Code"
"docker" = "Docker Desktop"
"chrome" = "Google Chrome"
"edge" = "Microsoft Edge"
"explorer" = "File Explorer"
"file explorer" = "File Explorer"
"calc" = "Calculator"

[files]
# Jarvis can only find, open, and read files inside these folders. {documents}, {desktop},
# {downloads}, {pictures}, {music}, {videos} follow OneDrive redirection. Lists replace,
# so a local.toml that adds a folder must repeat the ones it keeps.
allowed_folders = ["{documents}", "{desktop}", "{downloads}"]
# Never read or open these, even inside allowed folders (matched on the file name).
blocked_patterns = [
    ".env", ".env.*", "*.pem", "*.key", "*.pfx", "*.p12", "*.kdbx", "*.ppk",
    "id_rsa*", "id_ed25519*", "id_ecdsa*", ".git-credentials", ".netrc", ".npmrc", ".pypirc",
    "*credential*", "*secret*", "*password*", "*.wallet",
]
blocked_extensions = [".reg"]  # opening a .reg file edits the registry
# Opening these runs a program, so it asks first.
confirm_extensions = [
    ".exe", ".msi", ".bat", ".cmd", ".com", ".ps1", ".vbs", ".vbe", ".js", ".jse",
    ".wsf", ".wsh", ".scr", ".lnk", ".hta", ".cpl", ".jar", ".appref-ms", ".py", ".pyw",
]
skip_dirs = [
    ".git", "node_modules", ".venv", "venv", "env", "__pycache__", ".mypy_cache",
    ".ruff_cache", ".pytest_cache", ".cache", ".idea", ".vs", "dist", "build", ".next",
    "target", "AppData", "$Recycle.Bin", "site-packages",
]
index_max_age_hours = 12     # rebuild the file index in the background after this
max_indexed_files = 300000
read_max_chars = 6000        # how much of a file the model gets to see
read_max_mb = 25             # larger files are not read
everything = "auto"          # use Everything (voidtools es.exe) for search if installed

[search]
max_results = 5
region = "us-en"

[web]
fetch_max_chars = 6000       # page text the model gets to see
fetch_max_mb = 3             # larger downloads are cut off

[market]
# Tried in order. Providers without an API key in .env are skipped; yfinance needs none.
# Exchange-listed symbols (RELIANCE.NS) and indices (^NSEI) always try yfinance first.
providers = ["finnhub", "twelvedata", "alphavantage", "yfinance"]
# When symbol search finds the same company on one of these exchanges, use that listing,
# for example Infosys on NSE (INFY.NS) rather than its US share (INFY).
prefer_listings = [".NS", ".BO"]
crypto_currency = "USD"      # used when a crypto question names no currency

[market.aliases]
# Spoken names that symbol search gets wrong or that are faster to skip searching for.
"nifty" = "^NSEI"
"nifty 50" = "^NSEI"
"nifty fifty" = "^NSEI"
"bank nifty" = "^NSEBANK"
"sensex" = "^BSESN"
"nasdaq" = "^IXIC"
"dow" = "^DJI"
"dow jones" = "^DJI"
"s&p 500" = "^GSPC"
"s and p 500" = "^GSPC"
"gold" = "GC=F"
"silver" = "SI=F"
"crude oil" = "CL=F"

[weather]
home = ""                    # your city, for example "Hyderabad"; set it in config/local.toml
units = "celsius"            # or "fahrenheit"

[system]
screenshot_folder = "{pictures}/Screenshots"

[ui]
read_max_chars = 6000        # window text the model gets to see
window_wait_s = 10           # how long type_text waits for an app it had to start

[browser]
# Jarvis's own browser for browser_open, browser_click, and browser_type. Its profile lives in
# %LOCALAPPDATA%\Jarvis\browser-profile, apart from your everyday browser.
channel = "auto"             # your Windows default if it is Brave, Chrome, or Edge; else Edge.
                             # Or "brave", "chrome", "msedge", "chromium" (playwright install chromium)
executable = ""              # full path to a Chromium-based browser; wins over channel
read_max_chars = 6000        # page text the model gets to see
max_elements = 60            # links, buttons, and fields listed for the model
navigation_timeout_s = 30

[contacts]
default_country_code = ""    # for numbers saved without one, for example "91"; set it in local.toml
match_threshold = 85         # 0 to 100, how close a spoken name must be to a contact or alias

[whatsapp]
# "auto": WhatsApp Web in its own profile (link it once: uv run jarvis whatsapp login), or the
# desktop app if Web is not linked or does not load. "web" or "desktop" use only that one.
method = "auto"
max_chars = 1000             # longer messages are refused, so the read back stays short enough
verify_timeout_s = 15        # wait this long for the sent tick after pressing Send

[notifications]
# Jarvis checks the Windows notification center (it cannot be told about changes, RISKS.md R4).
enabled = true
apps = ["WhatsApp", "Claude"]  # display names or app ids; other apps' notifications are ignored
poll_s = 2                   # seconds between checks while Jarvis runs
keep_days = 7                # notification text older than this is deleted
max_read = 5                 # how many are read out at once

[server]
port = 8765                  # the web UI: http://127.0.0.1:8765 (never reachable from the network)
open_browser = true          # open the page when `jarvis serve` starts
speak_replies = false        # also say the answers to commands typed on the page

[bridge]
# Claude Code asks you through Jarvis (install once with: uv run jarvis claude-hook install).
enabled = true
answer_timeout_s = 120       # no answer by then: Claude Code asks you as usual
questions = true             # Claude's multiple-choice questions, answered by voice or the page
permissions = true           # tool permissions: a clear spoken yes allows, no denies, silence asks as usual
announce = true              # say "Claude is waiting for you" and "Claude finished"
phone = ""                   # "" (off), "ntfy" (a push with answer buttons), or "twilio" (a real call)
escalate_after_s = 45        # how long the PC gets before the phone is tried

[phone]
number = ""                  # your own number, +91..., set it in local.toml
ntfy_server = "https://ntfy.sh"
ntfy_topic = ""              # a long random name, in local.toml; anyone who knows it can read it
twilio_from = ""             # a Twilio number allowed to call yours
twilio_flow_sid = ""         # the Studio flow imported from docs/twilio-ask-flow.json

[tts]
engine = "piper"             # "piper", or "sapi" (built-in Windows voice); falls back to sapi if Piper is not installed
rate = 0                     # -10 (slow) to 10 (fast)
