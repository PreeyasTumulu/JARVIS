# Jarvis default configuration (committed).
# Put your own changes in config/local.toml, which is gitignored and overrides these values.
# Secrets never go here. They go in .env (see .env.example).

[agent]
max_iterations = 6           # model calls per command before giving up
turn_timeout_s = 120         # hard ceiling for one command
tool_timeout_s = 20          # default per tool call, tools can override
max_tool_calls_per_step = 4  # parallel tool calls accepted from one model reply
history_turns = 8            # past commands kept in the conversation
max_tool_result_chars = 4000 # tool output is truncated to this before the model sees it

[llm]
default = "local"

[llm.providers.local]
base_url = "http://localhost:11434/v1"
model = "jarvis-hermes3"     # created from config/ollama/hermes3-8b.Modelfile
temperature = 0.2
timeout_s = 120

[safety]
# Apps that open without asking. Others follow unlisted_apps.
app_allowlist = [
    "Notepad",
    "Calculator",
    "Visual Studio Code",
    "Docker Desktop",
    "Claude",
    "WhatsApp",
    "Google Chrome",
    "Microsoft Edge",
    "File Explorer",
    "Settings",
]
unlisted_apps = "confirm"    # "confirm" or "block"
confirm_timeout_s = 30       # no answer within this time means no
# Apps that close without asking, unless a window title shows unsaved changes.
safe_to_close = ["Calculator", "Settings", "File Explorer"]

[safety.tool_risk_overrides]
# Raise a tool's risk level, for example: open_app = "confirm"
# Values below a tool's built-in floor are ignored, so this can only tighten.

[apps]
match_threshold = 75         # 0 to 100, minimum fuzzy match score for an app name

[apps.process_names]
# Executable behind an app, used to find its open windows when the index does not know it.
"File Explorer" = "explorer"
"Visual Studio Code" = "Code"
"Google Chrome" = "chrome"
"Microsoft Edge" = "msedge"
"Brave" = "brave"

[apps.aliases]
"vs code" = "Visual Studio Code"
"vscode" = "Visual Studio Code"
"code" = "Visual Studio Code"
"docker" = "Docker Desktop"
"chrome" = "Google Chrome"
"edge" = "Microsoft Edge"
"explorer" = "File Explorer"
"file explorer" = "File Explorer"
"calc" = "Calculator"

[files]
# Jarvis can only find, open, and read files inside these folders. {documents}, {desktop},
# {downloads}, {pictures}, {music}, {videos} follow OneDrive redirection. Lists replace,
# so a local.toml that adds a folder must repeat the ones it keeps.
allowed_folders = ["{documents}", "{desktop}", "{downloads}"]
# Never read or open these, even inside allowed folders (matched on the file name).
blocked_patterns = [
    ".env", ".env.*", "*.pem", "*.key", "*.pfx", "*.p12", "*.kdbx", "*.ppk",
    "id_rsa*", "id_ed25519*", "id_ecdsa*", ".git-credentials", ".netrc", ".npmrc", ".pypirc",
    "*credential*", "*secret*", "*password*", "*.wallet",
]
blocked_extensions = [".reg"]  # opening a .reg file edits the registry
# Opening these runs a program, so it asks first.
confirm_extensions = [
    ".exe", ".msi", ".bat", ".cmd", ".com", ".ps1", ".vbs", ".vbe", ".js", ".jse",
    ".wsf", ".wsh", ".scr", ".lnk", ".hta", ".cpl", ".jar", ".appref-ms", ".py", ".pyw",
]
skip_dirs = [
    ".git", "node_modules", ".venv", "venv", "env", "__pycache__", ".mypy_cache",
    ".ruff_cache", ".pytest_cache", ".cache", ".idea", ".vs", "dist", "build", ".next",
    "target", "AppData", "$Recycle.Bin", "site-packages",
]
index_max_age_hours = 12     # rebuild the file index in the background after this
max_indexed_files = 300000
read_max_chars = 6000        # how much of a file the model gets to see
read_max_mb = 25             # larger files are not read
everything = "auto"          # use Everything (voidtools es.exe) for search if installed

[search]
max_results = 5
region = "us-en"

[web]
fetch_max_chars = 6000       # page text the model gets to see
fetch_max_mb = 3             # larger downloads are cut off

[market]
# Tried in order. Providers without an API key in .env are skipped; yfinance needs none.
# Exchange-listed symbols (RELIANCE.NS) and indices (^NSEI) always try yfinance first.
providers = ["finnhub", "twelvedata", "alphavantage", "yfinance"]
# When symbol search finds the same company on one of these exchanges, use that listing,
# for example Infosys on NSE (INFY.NS) rather than its US share (INFY).
prefer_listings = [".NS", ".BO"]
crypto_currency = "USD"      # used when a crypto question names no currency

[market.aliases]
# Spoken names that symbol search gets wrong or that are faster to skip searching for.
"nifty" = "^NSEI"
"nifty 50" = "^NSEI"
"nifty fifty" = "^NSEI"
"bank nifty" = "^NSEBANK"
"sensex" = "^BSESN"
"nasdaq" = "^IXIC"
"dow" = "^DJI"
"dow jones" = "^DJI"
"s&p 500" = "^GSPC"
"s and p 500" = "^GSPC"
"gold" = "GC=F"
"silver" = "SI=F"
"crude oil" = "CL=F"

[weather]
home = ""                    # your city, for example "Hyderabad"; set it in config/local.toml
units = "celsius"            # or "fahrenheit"

[system]
screenshot_folder = "{pictures}/Screenshots"

[server]
port = 8765                  # the web UI: http://127.0.0.1:8765 (never reachable from the network)
open_browser = true          # open the page when `jarvis serve` starts

[tts]
engine = "piper"             # "piper", or "sapi" (built-in Windows voice); falls back to sapi if Piper is not installed
rate = 0                     # -10 (slow) to 10 (fast)
