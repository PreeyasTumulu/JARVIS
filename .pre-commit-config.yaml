# Install once with: uv run pre-commit install
# Hooks run the project's own pinned tools through uv, so versions match CI.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: no-dashes
        name: no em or en dashes
        entry: uv run python scripts/check_dashes.py
        language: system
        pass_filenames: false
