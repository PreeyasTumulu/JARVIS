name: CI

on:
  push:
    branches: [main, "phase/**"]
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --extra voice

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests, the scripted e2e suite, and coverage
        run: uv run pytest --cov=jarvis --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=75

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

      - name: No em or en dashes
        run: uv run python scripts/check_dashes.py
