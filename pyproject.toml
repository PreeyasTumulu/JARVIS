[project]
name = "jarvis"
version = "0.1.0"
description = "Local-first voice-controlled desktop assistant for Windows 11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Preeyas Tumulu" }]
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "rapidfuzz>=3.9",
    "ddgs>=9.0",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.format]
exclude = ["*.md"]  # keep hand-aligned pseudo-code in docs as written

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["jarvis"]

[[tool.mypy.overrides]]
module = ["ddgs", "ddgs.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["llm: needs a running Ollama with the Jarvis models (run with -m llm)"]
addopts = "-m 'not llm'"
