<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis constellation</title>
<style>
  /* Constellation: a globe of stars that leans in to listen, spins to think, ripples to speak,
     and gathers into a ring while it waits for your yes. */
  :root {
    --night: #161C40;
    --night-2: #222A5C;
    --star: #F4EEDC;
    --soft: #A9B0D6;
    --tint: #F4EEDC;
    --dock-bg: #11163A;
    --dock-fg: #C9CDE8;
    --dock-line: #343C72;
    --dock-accent: #F4EEDC;
    --dock-on-accent: #161C40;
  }
  body[data-state="listening"] { --tint: #8FD8FF; }
  body[data-state="thinking"] { --tint: #C7B5FF; }
  body[data-state="speaking"] { --tint: #FFE2A8; }
  body[data-state="confirm"] { --tint: #FFBE5C; }
  body[data-state="tool"] { --tint: #7FE8CF; }
  body[data-state="error"] { --tint: #FF8A80; }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; color: var(--star);
    background: radial-gradient(ellipse 90% 80% at 60% 40%, var(--night-2) 0%, var(--night) 65%);
    font-family: "Segoe UI Variable Display", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  }
  .sky { position: relative; flex: 1; min-height: 360px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .words {
    position: absolute; left: clamp(16px, 5vw, 64px); bottom: clamp(16px, 5vh, 48px);
    max-width: min(46ch, calc(100% - 32px));
  }
  .state { margin: 0 0 6px; font-size: 15px; color: var(--tint); }
  .heard, .say, .ask { margin: 0; font-size: clamp(22px, 3vw, 34px); font-weight: 300; line-height: 1.2; text-wrap: balance; }
  .heard { color: var(--soft); }
  .tool { margin: 8px 0 0; font: 13px Consolas, "Cascadia Mono", monospace; color: var(--tint); }
  .confirm { display: none; }
  .confirm .buttons { display: flex; gap: 10px; margin-top: 16px; }
  .confirm button { font: inherit; font-size: 16px; padding: 7px 24px; border-radius: 999px; cursor: pointer; border: 1px solid var(--tint); background: transparent; color: var(--star); }
  .confirm button[data-kit-answer="yes"] { background: var(--tint); color: var(--night); }
  .confirm button:focus-visible { outline: 2px solid var(--star); outline-offset: 3px; }
  body[data-state="confirm"] .confirm { display: block; }
  body[data-state="confirm"] .say { display: none; }
  body:not([data-state="listening"]):not([data-state="thinking"]) .heard { display: none; }
  body[data-state="listening"] .say, body[data-state="thinking"] .say { display: none; }
  body[data-state="idle"] .say { color: var(--soft); }
</style>
</head>
<body data-state="idle">
<main class="sky">
  <canvas id="sky" aria-hidden="true"></canvas>
  <section class="words" aria-live="polite">
    <p class="state" data-kit="label">Idle</p>
    <p class="heard" data-kit="heard"></p>
    <p class="say" data-kit="say"></p>
    <div class="confirm">
      <p class="ask" data-kit="ask"></p>
      <div class="buttons">
        <button type="button" data-kit-answer="yes">Yes</button>
        <button type="button" data-kit-answer="no">No</button>
      </div>
    </div>
    <p class="tool" data-kit="tool"></p>
  </section>
</main>
<nav id="dock"></nav>
<script>
// kit:begin
// The demo kit: the seven states, a scripted run, the controls, and the microphone level.
// Every demo page carries a copy between its kit markers; edit this file, then run
// `uv run python scripts/build_ui_demos.py` (a test checks the copies match).
//
// A page reads Kit.scene in Kit.onFrame(fn) and styles itself from body[data-state].
// Elements marked data-kit="heard" | "say" | "ask" | "tool" | "label" get their text here,
// and buttons marked data-kit-answer="yes" | "no" answer the confirmation.
// Nothing here makes a network request. The microphone is opened only after its button is
// pressed, and its sound never leaves the page: only a loudness number is read.
const Kit = (() => {
  const STATES = ["idle", "listening", "thinking", "speaking", "confirm", "tool", "error"];
  const NAMES = {
    idle: "Idle",
    listening: "Listening",
    thinking: "Thinking",
    speaking: "Speaking",
    confirm: "Waiting for your yes",
    tool: "Running a tool",
    error: "Error",
  };
  // What each state shows when picked by hand, and in screenshots.
  const EXAMPLE = {
    idle: { say: "Say “Hey Jarvis”" },
    listening: { heard: "send the clipboard to my phone" },
    thinking: { heard: "send the clipboard to my phone" },
    confirm: { ask: "Send what you copied to your OnePlus Nord2 5G?" },
    tool: { tool: "send_to_phone", say: "Sending to your OnePlus Nord2 5G" },
    speaking: { say: "Sent what you copied to your OnePlus Nord2 5G." },
    error: { say: "Your OnePlus isn’t paired yet. Open KDE Connect on the PC and press Pair." },
  };
  const SCRIPT = [
    { state: "idle", ms: 1800, ...EXAMPLE.idle },
    { state: "listening", ms: 2800, heard: "send the clipboard to my phone" },
    { state: "thinking", ms: 1300, heard: "send the clipboard to my phone" },
    { state: "confirm", ms: 2600, ...EXAMPLE.confirm, auto: "yes" },
    { state: "idle", ms: 1600, ...EXAMPLE.idle },
    { state: "listening", ms: 1700, heard: "find my phone" },
    { state: "tool", ms: 1200, tool: "ring_phone", say: "Looking for your phone" },
    { state: "error", ms: 3400, ...EXAMPLE.error },
  ];
  const AFTER_YES = [
    { state: "tool", ms: 1400, ...EXAMPLE.tool },
    { state: "speaking", ms: 2800, ...EXAMPLE.speaking },
  ];
  const AFTER_NO = [{ state: "speaking", ms: 1600, say: "Okay, I won’t." }];

  const params = new URLSearchParams(location.search);
  const still = params.has("still"); // a frozen frame, for screenshots
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const scene = {
    state: "idle", heard: "", heardShown: "", say: "", ask: "", tool: "",
    t: 0, since: 0, level: 0, mic: false, calm, still,
  };
  const frames = [];
  let queue = [];
  let stepEnds = 0;
  let looping = !still && !params.has("state");
  let step = null;
  let analyser = null;
  let samples = null;

  function show(entry, now) {
    step = entry;
    scene.state = entry.state;
    scene.heard = entry.heard || "";
    scene.say = entry.say || "";
    scene.ask = entry.ask || "";
    scene.tool = entry.tool || "";
    scene.since = now;
    stepEnds = entry.ms ? now + entry.ms / 1000 : Infinity;
    document.body.dataset.state = entry.state;
    for (const el of document.querySelectorAll("[data-kit]")) {
      const key = el.dataset.kit;
      if (key === "label") el.textContent = NAMES[entry.state];
      else if (key !== "heard") el.textContent = scene[key] || "";
    }
    for (const button of document.querySelectorAll("[data-kit-state]")) {
      button.setAttribute("aria-pressed", String(button.dataset.kitState === entry.state));
    }
  }

  function run(steps, now) {
    queue = steps.slice();
    show(queue.shift(), now);
  }

  function next(now) {
    if (step && step.auto) return answer(step.auto === "yes");
    if (queue.length) return show(queue.shift(), now);
    if (looping) return run(SCRIPT, now);
    stepEnds = Infinity;
  }

  function answer(yes) {
    if (scene.state !== "confirm") return;
    const now = performance.now() / 1000;
    queue = (yes ? AFTER_YES : AFTER_NO).slice();
    if (looping) queue.push(...SCRIPT);
    show(queue.shift(), now);
  }

  function pick(state) {
    looping = false;
    updatePlay();
    queue = [];
    show({ state, ...EXAMPLE[state] }, performance.now() / 1000);
  }

  function noise(t) {
    return (Math.sin(t * 7.3) + Math.sin(t * 13.1 + 1.7) * 0.6 + Math.sin(t * 29.9 + 0.4) * 0.3) / 1.9;
  }

  function syntheticLevel(t, inState) {
    switch (scene.state) {
      case "listening": return Math.min(1, 0.3 + 0.45 * Math.abs(noise(t * 1.4)));
      case "speaking": {
        const syllable = Math.abs(Math.sin(t * 9.5)) * (0.55 + 0.45 * Math.abs(Math.sin(t * 2.1)));
        return inState < 0.15 ? syllable * inState / 0.15 : syllable;
      }
      case "thinking": return 0.12 + 0.05 * Math.sin(t * 3);
      case "tool": return 0.2;
      default: return 0;
    }
  }

  function micLevel() {
    analyser.getFloatTimeDomainData(samples);
    let sum = 0;
    for (const v of samples) sum += v * v;
    return Math.min(1, Math.sqrt(sum / samples.length) * 6);
  }

  function tick(ms) {
    const now = ms / 1000;
    if (!still && now >= stepEnds) next(now);
    const t = still ? 2.2 : now;
    const inState = still ? 1.4 : now - scene.since;
    scene.t = t;
    const target = scene.mic && scene.state === "listening" ? micLevel() : syntheticLevel(t, inState);
    scene.level = still ? target : scene.level + (target - scene.level) * 0.25;
    // The words appear as they are heard.
    const share = scene.state === "listening" && !still ? Math.min(1, inState / 1.8) : 1;
    scene.heardShown = scene.heard.slice(0, Math.ceil(scene.heard.length * share));
    for (const el of document.querySelectorAll('[data-kit="heard"]')) {
      if (el.textContent !== scene.heardShown) el.textContent = scene.heardShown;
    }
    for (const fn of frames) fn(scene);
    requestAnimationFrame(tick); // a frozen frame keeps drawing the same picture, so resizes redraw
  }

  async function toggleMic(button, status) {
    if (scene.mic) {
      scene.mic = false;
      analyser.context.close();
      analyser = null;
      button.textContent = "Use my microphone";
      status.textContent = "";
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const context = new AudioContext();
      analyser = context.createAnalyser();
      analyser.fftSize = 1024;
      samples = new Float32Array(analyser.fftSize);
      context.createMediaStreamSource(stream).connect(analyser);
      scene.mic = true;
      button.textContent = "Stop using the microphone";
      status.textContent = "Listening follows your voice. Nothing is recorded or sent.";
      pick("listening");
    } catch (error) {
      status.textContent = "The microphone was not allowed. Allow it in the address bar and try again.";
    }
  }

  let playButton = null;
  function updatePlay() {
    if (playButton) playButton.textContent = looping ? "Pause the demo" : "Play the demo";
  }

  function dock() {
    const nav = document.querySelector("#dock");
    if (!nav) return;
    nav.setAttribute("aria-label", "Demo controls");
    const states = document.createElement("div");
    states.className = "kit-states";
    states.setAttribute("role", "group");
    states.setAttribute("aria-label", "Show a state");
    STATES.forEach((state, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.dataset.kitState = state;
      button.textContent = NAMES[state];
      button.title = `${NAMES[state]} (key ${index + 1})`;
      button.addEventListener("click", () => pick(state));
      states.append(button);
    });
    const actions = document.createElement("div");
    actions.className = "kit-actions";
    playButton = document.createElement("button");
    playButton.type = "button";
    playButton.addEventListener("click", () => {
      looping = !looping;
      updatePlay();
      if (looping) run(SCRIPT, performance.now() / 1000);
    });
    const mic = document.createElement("button");
    mic.type = "button";
    mic.textContent = "Use my microphone";
    const status = document.createElement("p");
    status.className = "kit-status";
    status.setAttribute("role", "status");
    mic.addEventListener("click", () => toggleMic(mic, status));
    actions.append(playButton, mic);
    nav.append(states, actions, status);
    updatePlay();
  }

  const css = `
  #dock { display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 8px 16px; padding: 10px 16px; color: var(--dock-fg); background: var(--dock-bg);
    font: 13px/1.3 var(--dock-font, inherit); }
  #dock button { font: inherit; color: inherit; background: transparent; cursor: pointer;
    border: 1px solid var(--dock-line); border-radius: var(--dock-radius, 999px); padding: 5px 11px; }
  #dock button:hover { border-color: var(--dock-fg); }
  #dock button[aria-pressed="true"] { background: var(--dock-accent); color: var(--dock-on-accent);
    border-color: var(--dock-accent); }
  #dock button:focus-visible, [data-kit-answer]:focus-visible { outline: 2px solid var(--dock-accent);
    outline-offset: 2px; }
  .kit-states, .kit-actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .kit-status { margin: 0; width: 100%; text-align: center; min-height: 1.3em; opacity: .8; }
  body.kit-still #dock { display: none; }`;

  function start() {
    const style = document.createElement("style");
    style.textContent = css;
    document.head.append(style);
    if (still) document.body.classList.add("kit-still");
    dock();
    for (const button of document.querySelectorAll("[data-kit-answer]")) {
      button.addEventListener("click", () => answer(button.dataset.kitAnswer === "yes"));
    }
    addEventListener("keydown", (event) => {
      if (event.target.closest && event.target.closest("input, textarea")) return;
      const index = Number(event.key) - 1;
      if (index >= 0 && index < STATES.length) pick(STATES[index]);
      else if (event.key === " " && event.target === document.body) {
        event.preventDefault();
        playButton.click();
      }
    });
    const first = params.get("state");
    const now = performance.now() / 1000;
    if (STATES.includes(first)) show({ state: first, ...EXAMPLE[first] }, now);
    else run(SCRIPT, now);
    requestAnimationFrame(tick);
  }

  if (document.readyState === "loading") addEventListener("DOMContentLoaded", start);
  else start();
  return { STATES, NAMES, scene, onFrame: (fn) => frames.push(fn), pick, answer };
})();
// kit:end
</script>
<script>
  const canvas = document.querySelector("#sky");
  const ctx = canvas.getContext("2d");
  const N = 240;
  // Points spread evenly over a sphere (a Fibonacci lattice), each with where it is now.
  const stars = Array.from({ length: N }, (_, i) => {
    const y = 1 - (2 * (i + 0.5)) / N;
    const r = Math.sqrt(1 - y * y);
    const a = i * Math.PI * (3 - Math.sqrt(5));
    return { x: Math.cos(a) * r, y, z: Math.sin(a) * r, px: 0, py: 0, pz: 0, ready: false, twinkle: (i * 7.31) % 6.28 };
  });
  let spin = 0;
  let last = 0;

  function size() {
    const ratio = devicePixelRatio || 1;
    const { width, height } = canvas.getBoundingClientRect();
    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  }
  addEventListener("resize", size);
  size();

  function target(star, s) {
    let { x, y, z } = star;
    const lat = Math.asin(y);
    switch (s.state) {
      case "listening": {
        const k = 1 + s.level * 0.22 * (0.6 + 0.4 * Math.sin(lat * 6 + s.t * 5));
        return [x * k, y * k, z * k];
      }
      case "speaking": {
        const k = 1 + s.level * 0.16 * Math.sin(lat * 9 - s.t * 7);
        return [x * k, y * k, z * k];
      }
      case "confirm": {
        const r = Math.hypot(x, z) || 1;
        return [(x / r) * 1.05, y * 0.08, (z / r) * 1.05];
      }
      case "error":
        return [x * 0.95, y * 0.6 + 0.35, z * 0.95];
      case "idle":
        return [x * 0.9, y * 0.9, z * 0.9];
      default:
        return [x, y, z];
    }
  }

  Kit.onFrame((s) => {
    const { width, height } = canvas.getBoundingClientRect();
    const dt = s.still ? 0 : Math.min(0.05, s.t - last);
    last = s.t;
    const speeds = { idle: 0.08, listening: 0.12, thinking: 1.4, speaking: 0.2, confirm: 0.3, tool: 0.5, error: 0.02 };
    spin += (s.calm ? 0 : speeds[s.state]) * dt;
    const turn = s.still ? 0.8 : spin;
    const tilt = s.state === "thinking" ? 0.5 : 0.28;
    const tint = getComputedStyle(document.body).getPropertyValue("--tint").trim();
    const wide = width > 760;
    const cx = wide ? width * 0.62 : width / 2;
    const cy = wide ? height * 0.46 : height * 0.38;
    const R = Math.min(width, height) * (wide ? 0.34 : 0.3);

    // Thinking leaves short trails; everything else is drawn fresh.
    if (s.state === "thinking" && !s.still && !s.calm) {
      ctx.globalCompositeOperation = "destination-out";
      ctx.fillStyle = "rgba(0,0,0,0.28)";
      ctx.fillRect(0, 0, width, height);
      ctx.globalCompositeOperation = "source-over";
    } else {
      ctx.clearRect(0, 0, width, height);
    }

    const cosA = Math.cos(turn), sinA = Math.sin(turn), cosT = Math.cos(tilt), sinT = Math.sin(tilt);
    const ease = s.still ? 1 : 0.08;
    for (const star of stars) {
      const [tx, ty, tz] = target(star, s);
      if (!star.ready) { star.px = tx; star.py = ty; star.pz = tz; star.ready = true; }
      star.px += (tx - star.px) * ease;
      star.py += (ty - star.py) * ease;
      star.pz += (tz - star.pz) * ease;
      const x1 = star.px * cosA + star.pz * sinA;
      const z1 = -star.px * sinA + star.pz * cosA;
      const y2 = star.py * cosT - z1 * sinT;
      const z2 = star.py * sinT + z1 * cosT;
      const depth = (z2 + 1.3) / 2.6;
      const x = cx + x1 * R, y = cy + y2 * R;
      const glint = s.calm ? 1 : 0.75 + 0.25 * Math.sin(s.t * 2 + star.twinkle);
      ctx.globalAlpha = Math.max(0.08, Math.min(1, depth * glint * (s.state === "idle" ? 0.7 : 1)));
      ctx.fillStyle = depth > 0.55 ? tint : "#F4EEDC";
      ctx.beginPath();
      ctx.arc(x, y, 0.9 + depth * 2.4, 0, Math.PI * 2);
      ctx.fill();
    }

    // A running tool: three bright stars in orbit.
    if (s.state === "tool") {
      for (let k = 0; k < 3; k++) {
        const a = turn * 3 + (k * Math.PI * 2) / 3;
        ctx.globalAlpha = 1;
        ctx.fillStyle = tint;
        ctx.beginPath();
        ctx.arc(cx + Math.cos(a) * R * 1.35, cy + Math.sin(a) * R * 0.45, 3.2, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  });
</script>
</body>
</html>
