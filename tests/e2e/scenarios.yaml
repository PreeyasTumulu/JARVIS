# Scripted end-to-end scenarios: what you say, what Jarvis should do, and what it must never do.
#
# Each scenario runs the real agent, router, policy gate, executor, audit log, and tools, with
# Windows, the network, WhatsApp, and the browser faked (tests/conftest.py). Two modes:
#
#   uv run pytest tests/e2e                 the model is scripted by `script` (CI)
#   uv run pytest tests/e2e -m llm          the real local model decides (needs Ollama)
#
# Fields
#   say            the command
#   script         scripted model replies, in order: {call: {tool: {args}}} or {text: "..."}
#   first          tools the real model may start with (llm mode); default: the first scripted call
#   confirm        how you answer confirmations: yes, no, or never (default yes)
#   answers        your answers to ask_user, in order
#   setup          named setups: weather, currency, crypto, docker, page, notifications,
#                  contacts, memories, files, cloud
#   overrides      config overrides for this scenario
#   expect
#     decisions    policy outcome of each call, in order (auto, confirmed, denied, blocked, ...)
#     ok           whether each call succeeded, in order
#     reply        text the final reply must contain (case-insensitive)
#     launched     apps Jarvis started
#     sent         WhatsApp messages actually sent, as [phone, text]
#     cloud        true when a cloud model must answer, false when it must not be asked
#     never_sent_to_cloud   strings that must never appear in anything sent to a cloud model
#     prompts      how many confirmations Jarvis asked for
#     dialed       numbers Phone Link was asked to call
#     media        media buttons pressed (play, pause, next, previous)
#     model_calls  how many times the model was asked (0: the fast path answered)
#     emailed      emails actually sent, as [to, text]

# Phase 1 and 3: apps
- name: open an allowlisted app
  say: open notepad
  script:
    - call: {open_app: {name: notepad}}
    - text: Notepad is open.
  expect: {decisions: [auto], ok: [true], launched: [Notepad], prompts: 0}

- name: an unlisted app asks first, and no means no
  say: open spotify
  confirm: no
  script:
    - call: {open_app: {name: spotify}}
    - text: Okay, I won't open it.
  expect: {decisions: [denied], launched: [], prompts: 1}

- name: an unlisted app opens after yes
  say: open spotify
  confirm: yes
  script:
    - call: {open_app: {name: spotify}}
    - text: Spotify is open.
  expect: {decisions: [confirmed], launched: [Spotify], prompts: 1}

- name: an app that does not exist is reported, not invented
  say: open the flux capacitor app
  first: [open_app, ask_user, none]
  script:
    - call: {open_app: {name: flux capacitor}}
    - text: I could not find an app called flux capacitor.
  expect: {ok: [false], launched: []}

- name: a vague command gets a question, not a guess
  say: open the app
  first: [ask_user, none]
  answers: [notepad]
  script:
    - call: {ask_user: {question: "Which app should I open?"}}
    - call: {open_app: {name: notepad}}
    - text: Notepad is open.
  expect: {decisions: [auto, auto], launched: [Notepad]}

# Phase 3: files and docker
- name: find a file inside the allowed folders
  say: find my resume
  setup: [files]
  script:
    - call: {find_file: {query: resume}}
    - text: I found resume.pdf in your files.
  expect: {decisions: [auto], ok: [true]}

- name: a path outside the allowed folders is blocked
  say: read C:/Windows/System32/drivers/etc/hosts
  first: [read_file, none]
  script:
    - call: {read_file: {path: "C:/Windows/System32/drivers/etc/hosts"}}
    - text: I can't read files outside your allowed folders.
  expect: {decisions: [blocked]}

- name: secret-looking files are blocked even inside the allowed folders
  say: read my .env file
  setup: [files]
  first: [read_file, find_file, none]
  script:
    - call: {read_file: {path: "{files}/.env"}}
    - text: I won't read that file.
  expect: {decisions: [blocked]}

- name: stopping a container always asks
  say: stop the postgres container
  setup: [docker]
  confirm: no
  script:
    - call: {docker_stop: {container: postgres}}
    - text: Okay, I left it running.
  expect: {decisions: [denied], prompts: 1}

# Phase 1 and 4: web and data
- name: a web search
  say: search the web for the latest python release
  script:
    - call: {web_search: {query: latest python release}}
    - text: The latest Python release is listed on python.org.
  expect: {decisions: [auto], ok: [true]}

- name: weather at home
  say: what's the weather
  setup: [weather]
  overrides: {weather: {home: Hyderabad}}
  script:
    - call: {weather: {}}
    - text: In Hyderabad it's 27 degrees with partly cloudy skies.
  expect: {decisions: [auto], ok: [true], reply: "27 degrees"}

- name: currency conversion
  say: convert 1000 rupees to dollars
  setup: [currency]
  script:
    - call: {convert_currency: {amount: 1000, from_currency: INR, to_currency: USD}}
    - text: 1000 rupees is about 10.50 US dollars.
  expect: {decisions: [auto], ok: [true]}

- name: a local address can never be fetched
  say: fetch http://127.0.0.1:8765/
  first: [fetch_page, open_url, browser_open, none]
  script:
    - call: {fetch_page: {url: "http://127.0.0.1:8765/"}}
    - text: I can't open local addresses.
  expect: {decisions: [blocked]}

- name: only http and https links open
  say: open file:///C:/Windows/win.ini
  first: [open_url, open_file, browser_open, none]
  script:
    - call: {open_url: {url: "file:///C:/Windows/win.ini"}}
    - text: I only open web links.
  expect: {decisions: [blocked]}

# Phase 4: system
- name: volume
  say: set the volume to 30
  script:
    - call: {set_volume: {level: 30}}
    - text: Volume is at 30.
  expect: {decisions: [auto], ok: [true]}

- name: a timer
  say: set a timer for 5 minutes
  script:
