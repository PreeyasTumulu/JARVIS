# Copy to config/local.toml and edit. Anything here overrides config/jarvis.toml.
# Tables merge key by key; lists replace the default list entirely.

# Use the smaller model if the 8B one is too slow on your GPU.
# [llm.providers.local]
# model = "jarvis-hermes3-3b"

# [safety]
# app_allowlist = ["Notepad", "Visual Studio Code", "Docker Desktop", "Spotify"]
# unlisted_apps = "block"

# safe_to_close = ["Calculator", "Settings", "File Explorer", "Spotify"]
# trusted_ui_apps = ["Notepad", "Calculator"]  # type, click, and press keys without asking

# [apps.aliases]
# "music" = "Spotify"

# [files]
# allowed_folders = ["{documents}", "{desktop}", "{downloads}", "C:/Projects"]
# everything = "never"                # ignore Everything even if it is installed

# [agent]
# tool_routing = "all"                # show the model every tool on every request

# [tts]
# engine = "piper"               # or "sapi" (built-in Windows voice)
# piper_voice = "en_US-lessac-medium"
# piper_speed = 1.1

# [voice]
# input_device = "Microphone Array"   # part of a name from: uv run jarvis voice --list-devices
# ptt_hotkey = "ctrl+alt+j"
# stop_hotkey = "ctrl+alt+x"
# wake_word_enabled = true            # same as: uv run jarvis voice --wake
# stt_model = "base.en"               # about 3x faster than small.en, a little less accurate

# [weather]
# home = "Hyderabad"                  # used when you ask without naming a place

# [market]
# crypto_currency = "INR"             # "bitcoin price" in rupees
# [market.aliases]
# "reliance" = "RELIANCE.NS"          # skip the symbol search for names you use often

# [contacts]
# default_country_code = "91"         # for numbers saved without one, like 98765 43210

# [whatsapp]
# method = "desktop"                  # "auto" (Web once linked, else the app), "web", or "desktop"

# [browser]
# channel = "chromium"                # Playwright's Chromium instead of Edge (uv run playwright install chromium)

# [notifications]
# apps = ["WhatsApp"]                 # only these apps' notifications are read and kept
# keep_days = 3
