<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis pill</title>
<style>
  /* Pill: a small dark capsule above the taskbar that grows only as much as each state needs.
     The most practical one: always there, never in the way. */
  :root {
    --capsule: rgba(24, 27, 34, 0.9);
    --on: #F2F4F7;
    --soft: #9AA3B2;
    --accent: #7FB2FF;
    --dock-bg: #E7EDE9;
    --dock-fg: #26302B;
    --dock-line: #BFCCC4;
    --dock-accent: #1E2A24;
    --dock-on-accent: #F2F4F7;
  }
  body[data-state="listening"] { --accent: #6FB7FF; }
  body[data-state="thinking"] { --accent: #B79CFF; }
  body[data-state="speaking"] { --accent: #FFD08A; }
  body[data-state="confirm"] { --accent: #FFB547; }
  body[data-state="tool"] { --accent: #5ED6B8; }
  body[data-state="error"] { --accent: #FF6B63; }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    font-family: "Segoe UI Variable Small", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  }
  .desktop {
    position: relative; flex: 1; min-height: 340px; overflow: hidden;
    background: linear-gradient(200deg, #E4ECE6 0%, #C9D8CF 50%, #A9C0B4 100%);
  }
  .browser {
    position: absolute; left: 6%; right: 6%; top: 6%; bottom: 172px; max-width: 900px; margin: 0 auto;
    background: #FFFFFF; border-radius: 8px; box-shadow: 0 16px 44px rgba(20, 40, 30, 0.2); overflow: hidden;
  }
  .browser .bar { height: 34px; background: #F0F3F1; display: flex; align-items: center; padding: 0 12px; gap: 8px; }
  .browser .bar i { display: block; height: 18px; flex: 1; max-width: 420px; border-radius: 9px; background: #E1E7E3; }
  .browser .page { padding: 22px; display: grid; gap: 12px; }
  .browser .page b { display: block; height: 12px; border-radius: 6px; background: #E8ECEA; }
  .browser .page b:nth-child(1) { width: 40%; height: 18px; background: #D5DED9; }
  .browser .page b:nth-child(3) { width: 85%; }
  .browser .page b:nth-child(4) { width: 70%; }
  .taskbar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 44px; display: flex; gap: 10px;
    align-items: center; justify-content: center; background: rgba(243, 246, 244, 0.85); backdrop-filter: blur(18px);
  }
  .taskbar span { width: 22px; height: 22px; border-radius: 5px; background: #93A79C; }
  .taskbar span:nth-child(3) { background: #FB542B; }

  .pill {
    position: absolute; left: 50%; bottom: 56px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 40px; width: 64px;
    max-width: calc(100% - 32px); border-radius: 20px; background: var(--capsule); color: var(--on);
    backdrop-filter: blur(20px); box-shadow: 0 8px 28px rgba(10, 20, 15, 0.28), inset 0 0 0 1px rgba(255,255,255,0.06);
    transition: width 360ms cubic-bezier(.2,.8,.2,1), height 360ms cubic-bezier(.2,.8,.2,1), border-radius 360ms;
    overflow: hidden; font-size: 14px;
  }
  @media (prefers-reduced-motion: reduce) { .pill { transition: none; } }
  body[data-state="idle"] .pill { width: 64px; height: 12px; padding: 0; justify-content: center; }
  body[data-state="listening"] .pill { width: 380px; }
  body[data-state="thinking"] .pill { width: 140px; justify-content: center; }
  body[data-state="speaking"] .pill { width: 440px; }
  body[data-state="tool"] .pill { width: 330px; }
  body[data-state="confirm"] .pill { width: 460px; height: 92px; border-radius: 22px; flex-direction: column; justify-content: center; gap: 8px; }
  body[data-state="error"] .pill { width: 500px; height: 64px; border-radius: 20px; box-shadow: 0 8px 28px rgba(10,20,15,.28), inset 0 0 0 1.5px var(--accent); }

  .pill > * { display: none; }
  canvas.wave { width: 96px; height: 24px; flex: none; }
  .text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .heard { color: var(--soft); }
  .dots { gap: 6px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: hop 900ms infinite ease-in-out; }
  .dots i:nth-child(2) { animation-delay: 150ms; }
  .dots i:nth-child(3) { animation-delay: 300ms; }
  @keyframes hop { 50% { transform: translateY(-6px); opacity: .6; } }
  @media (prefers-reduced-motion: reduce) { .dots i { animation: none; } }
  .ring { width: 16px; height: 16px; flex: none; border-radius: 50%; border: 2px solid rgba(255,255,255,.2); border-top-color: var(--accent); animation: turn 800ms linear infinite; }
  @keyframes turn { to { transform: rotate(1turn); } }
  @media (prefers-reduced-motion: reduce) { .ring { animation: none; } }
  .tool { font: 13px Consolas, "Cascadia Mono", monospace; color: var(--accent); }
  .idle-dot { width: 26px; height: 4px; border-radius: 2px; background: var(--soft); opacity: .7; }
  .ask { flex: none; text-align: center; white-space: normal; }
  .buttons { gap: 8px; }
  .buttons button { font: inherit; font-size: 13px; padding: 4px 18px; border-radius: 12px; cursor: pointer; border: 1px solid rgba(255,255,255,.25); background: transparent; color: var(--on); }
  .buttons button[data-kit-answer="yes"] { background: var(--accent); border-color: var(--accent); color: #1B1F27; }
  .buttons button:focus-visible { outline: 2px solid var(--on); outline-offset: 2px; }
  .error { white-space: normal; line-height: 1.3; }

  body[data-state="idle"] .idle-dot,
  body[data-state="listening"] .wave, body[data-state="listening"] .heard,
  body[data-state="thinking"] .dots,
  body[data-state="speaking"] .wave, body[data-state="speaking"] .say,
  body[data-state="tool"] .ring, body[data-state="tool"] .tool, body[data-state="tool"] .say,
  body[data-state="confirm"] .ask, body[data-state="confirm"] .buttons,
  body[data-state="error"] .error { display: flex; }
  body[data-state="listening"] .heard, body[data-state="speaking"] .say, body[data-state="tool"] .say { display: block; }
  body[data-state="tool"] .say { color: var(--soft); }
  .label { position: absolute; left: 50%; bottom: 102px; transform: translateX(-50%); margin: 0; font-size: 12px; color: #2D3A33; }
  body[data-state="confirm"] .label { bottom: 154px; }
  body[data-state="error"] .label { bottom: 126px; }
  body[data-state="idle"] .label { bottom: 76px; }
</style>
</head>
<body data-state="idle">
<main class="desktop">
  <div class="browser" aria-hidden="true">
    <div class="bar"><i></i></div>
    <div class="page"><b></b><b></b><b></b><b></b><b></b></div>
  </div>
  <div class="taskbar" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
  <p class="label" data-kit="label">Idle</p>
  <section class="pill" aria-live="polite">
    <span class="idle-dot" aria-hidden="true"></span>
    <canvas class="wave" id="wave" aria-hidden="true"></canvas>
    <span class="text heard" data-kit="heard"></span>
    <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="ring" aria-hidden="true"></span>
    <span class="tool" data-kit="tool"></span>
    <span class="text say" data-kit="say"></span>
    <span class="text ask" data-kit="ask"></span>
    <span class="buttons">
      <button type="button" data-kit-answer="yes">Yes</button>
      <button type="button" data-kit-answer="no">No</button>
    </span>
    <span class="text error" data-kit="say"></span>
  </section>
</main>
<nav id="dock"></nav>
<script>
// kit:begin
// The demo kit: the seven states, a scripted run, the controls, and the microphone level.
// Every demo page carries a copy between its kit markers; edit this file, then run
// `uv run python scripts/build_ui_demos.py` (a test checks the copies match).
//
// A page reads Kit.scene in Kit.onFrame(fn) and styles itself from body[data-state].
// Elements marked data-kit="heard" | "say" | "ask" | "tool" | "label" get their text here,
// and buttons marked data-kit-answer="yes" | "no" answer the confirmation.
// Nothing here makes a network request. The microphone is opened only after its button is
// pressed, and its sound never leaves the page: only a loudness number is read.
const Kit = (() => {
  const STATES = ["idle", "listening", "thinking", "speaking", "confirm", "tool", "error"];
  const NAMES = {
    idle: "Idle",
    listening: "Listening",
    thinking: "Thinking",
    speaking: "Speaking",
    confirm: "Waiting for your yes",
    tool: "Running a tool",
    error: "Error",
  };
  // What each state shows when picked by hand, and in screenshots.
  const EXAMPLE = {
    idle: { say: "Say “Hey Jarvis”" },
    listening: { heard: "send the clipboard to my phone" },
    thinking: { heard: "send the clipboard to my phone" },
    confirm: { ask: "Send what you copied to your OnePlus Nord2 5G?" },
    tool: { tool: "send_to_phone", say: "Sending to your OnePlus Nord2 5G" },
    speaking: { say: "Sent what you copied to your OnePlus Nord2 5G." },
    error: { say: "Your OnePlus isn’t paired yet. Open KDE Connect on the PC and press Pair." },
  };
  const SCRIPT = [
    { state: "idle", ms: 1800, ...EXAMPLE.idle },
    { state: "listening", ms: 2800, heard: "send the clipboard to my phone" },
    { state: "thinking", ms: 1300, heard: "send the clipboard to my phone" },
    { state: "confirm", ms: 2600, ...EXAMPLE.confirm, auto: "yes" },
    { state: "idle", ms: 1600, ...EXAMPLE.idle },
    { state: "listening", ms: 1700, heard: "find my phone" },
    { state: "tool", ms: 1200, tool: "ring_phone", say: "Looking for your phone" },
    { state: "error", ms: 3400, ...EXAMPLE.error },
  ];
  const AFTER_YES = [
    { state: "tool", ms: 1400, ...EXAMPLE.tool },
    { state: "speaking", ms: 2800, ...EXAMPLE.speaking },
  ];
  const AFTER_NO = [{ state: "speaking", ms: 1600, say: "Okay, I won’t." }];

  const params = new URLSearchParams(location.search);
  const still = params.has("still"); // a frozen frame, for screenshots
  const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const scene = {
    state: "idle", heard: "", heardShown: "", say: "", ask: "", tool: "",
    t: 0, since: 0, level: 0, mic: false, calm, still,
  };
  const frames = [];
  let queue = [];
  let stepEnds = 0;
  let looping = !still && !params.has("state");
  let step = null;
  let analyser = null;
  let samples = null;

  function show(entry, now) {
    step = entry;
    scene.state = entry.state;
    scene.heard = entry.heard || "";
    scene.say = entry.say || "";
    scene.ask = entry.ask || "";
    scene.tool = entry.tool || "";
    scene.since = now;
    stepEnds = entry.ms ? now + entry.ms / 1000 : Infinity;
    document.body.dataset.state = entry.state;
    for (const el of document.querySelectorAll("[data-kit]")) {
      const key = el.dataset.kit;
      if (key === "label") el.textContent = NAMES[entry.state];
      else if (key !== "heard") el.textContent = scene[key] || "";
    }
    for (const button of document.querySelectorAll("[data-kit-state]")) {
      button.setAttribute("aria-pressed", String(button.dataset.kitState === entry.state));
    }
  }

  function run(steps, now) {
    queue = steps.slice();
    show(queue.shift(), now);
  }

  function next(now) {
    if (step && step.auto) return answer(step.auto === "yes");
    if (queue.length) return show(queue.shift(), now);
    if (looping) return run(SCRIPT, now);
    stepEnds = Infinity;
  }

  function answer(yes) {
    if (scene.state !== "confirm") return;
    const now = performance.now() / 1000;
    queue = (yes ? AFTER_YES : AFTER_NO).slice();
    if (looping) queue.push(...SCRIPT);
    show(queue.shift(), now);
  }

  function pick(state) {
    looping = false;
    updatePlay();
    queue = [];
    show({ state, ...EXAMPLE[state] }, performance.now() / 1000);
  }

  function noise(t) {
    return (Math.sin(t * 7.3) + Math.sin(t * 13.1 + 1.7) * 0.6 + Math.sin(t * 29.9 + 0.4) * 0.3) / 1.9;
  }

  function syntheticLevel(t, inState) {
    switch (scene.state) {
      case "listening": return Math.min(1, 0.3 + 0.45 * Math.abs(noise(t * 1.4)));
      case "speaking": {
        const syllable = Math.abs(Math.sin(t * 9.5)) * (0.55 + 0.45 * Math.abs(Math.sin(t * 2.1)));
        return inState < 0.15 ? syllable * inState / 0.15 : syllable;
      }
      case "thinking": return 0.12 + 0.05 * Math.sin(t * 3);
      case "tool": return 0.2;
      default: return 0;
    }
  }

  function micLevel() {
    analyser.getFloatTimeDomainData(samples);
    let sum = 0;
    for (const v of samples) sum += v * v;
    return Math.min(1, Math.sqrt(sum / samples.length) * 6);
  }

  function tick(ms) {
    const now = ms / 1000;
    if (!still && now >= stepEnds) next(now);
    const t = still ? 2.2 : now;
    const inState = still ? 1.4 : now - scene.since;
    scene.t = t;
    const target = scene.mic && scene.state === "listening" ? micLevel() : syntheticLevel(t, inState);
    scene.level = still ? target : scene.level + (target - scene.level) * 0.25;
    // The words appear as they are heard.
    const share = scene.state === "listening" && !still ? Math.min(1, inState / 1.8) : 1;
    scene.heardShown = scene.heard.slice(0, Math.ceil(scene.heard.length * share));
    for (const el of document.querySelectorAll('[data-kit="heard"]')) {
      if (el.textContent !== scene.heardShown) el.textContent = scene.heardShown;
    }
    for (const fn of frames) fn(scene);
    requestAnimationFrame(tick); // a frozen frame keeps drawing the same picture, so resizes redraw
  }

  async function toggleMic(button, status) {
    if (scene.mic) {
      scene.mic = false;
      analyser.context.close();
      analyser = null;
      button.textContent = "Use my microphone";
      status.textContent = "";
      return;
    }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const context = new AudioContext();
      analyser = context.createAnalyser();
      analyser.fftSize = 1024;
      samples = new Float32Array(analyser.fftSize);
      context.createMediaStreamSource(stream).connect(analyser);
      scene.mic = true;
      button.textContent = "Stop using the microphone";
      status.textContent = "Listening follows your voice. Nothing is recorded or sent.";
      pick("listening");
    } catch (error) {
      status.textContent = "The microphone was not allowed. Allow it in the address bar and try again.";
    }
  }

  let playButton = null;
  function updatePlay() {
    if (playButton) playButton.textContent = looping ? "Pause the demo" : "Play the demo";
  }

  function dock() {
    const nav = document.querySelector("#dock");
    if (!nav) return;
    nav.setAttribute("aria-label", "Demo controls");
    const states = document.createElement("div");
    states.className = "kit-states";
    states.setAttribute("role", "group");
    states.setAttribute("aria-label", "Show a state");
    STATES.forEach((state, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.dataset.kitState = state;
      button.textContent = NAMES[state];
      button.title = `${NAMES[state]} (key ${index + 1})`;
      button.addEventListener("click", () => pick(state));
      states.append(button);
    });
    const actions = document.createElement("div");
    actions.className = "kit-actions";
    playButton = document.createElement("button");
    playButton.type = "button";
    playButton.addEventListener("click", () => {
      looping = !looping;
      updatePlay();
      if (looping) run(SCRIPT, performance.now() / 1000);
    });
    const mic = document.createElement("button");
    mic.type = "button";
    mic.textContent = "Use my microphone";
    const status = document.createElement("p");
    status.className = "kit-status";
    status.setAttribute("role", "status");
    mic.addEventListener("click", () => toggleMic(mic, status));
    actions.append(playButton, mic);
    nav.append(states, actions, status);
    updatePlay();
  }

  const css = `
  #dock { display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 8px 16px; padding: 10px 16px; color: var(--dock-fg); background: var(--dock-bg);
    font: 13px/1.3 var(--dock-font, inherit); }
  #dock button { font: inherit; color: inherit; background: transparent; cursor: pointer;
    border: 1px solid var(--dock-line); border-radius: var(--dock-radius, 999px); padding: 5px 11px; }
  #dock button:hover { border-color: var(--dock-fg); }
  #dock button[aria-pressed="true"] { background: var(--dock-accent); color: var(--dock-on-accent);
    border-color: var(--dock-accent); }
  #dock button:focus-visible, [data-kit-answer]:focus-visible { outline: 2px solid var(--dock-accent);
    outline-offset: 2px; }
  .kit-states, .kit-actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .kit-status { margin: 0; width: 100%; text-align: center; min-height: 1.3em; opacity: .8; }
  body.kit-still #dock { display: none; }`;

  function start() {
    const style = document.createElement("style");
    style.textContent = css;
    document.head.append(style);
    if (still) document.body.classList.add("kit-still");
    dock();
    for (const button of document.querySelectorAll("[data-kit-answer]")) {
      button.addEventListener("click", () => answer(button.dataset.kitAnswer === "yes"));
    }
    addEventListener("keydown", (event) => {
      if (event.target.closest && event.target.closest("input, textarea")) return;
      const index = Number(event.key) - 1;
      if (index >= 0 && index < STATES.length) pick(STATES[index]);
      else if (event.key === " " && event.target === document.body) {
        event.preventDefault();
        playButton.click();
      }
    });
    const first = params.get("state");
    const now = performance.now() / 1000;
    if (STATES.includes(first)) show({ state: first, ...EXAMPLE[first] }, now);
    else run(SCRIPT, now);
    requestAnimationFrame(tick);
  }

  if (document.readyState === "loading") addEventListener("DOMContentLoaded", start);
  else start();
  return { STATES, NAMES, scene, onFrame: (fn) => frames.push(fn), pick, answer };
})();
// kit:end
</script>
<script>
  const wave = document.querySelector("#wave");
  const ctx = wave.getContext("2d");
  const ratio = devicePixelRatio || 1;
  wave.width = 96 * ratio;
  wave.height = 24 * ratio;
  ctx.scale(ratio, ratio);
  const heights = new Array(16).fill(0.1);
  Kit.onFrame((s) => {
    if (s.state !== "listening" && s.state !== "speaking") return;
    const color = getComputedStyle(document.body).getPropertyValue("--accent").trim();
    ctx.clearRect(0, 0, 96, 24);
    ctx.fillStyle = color;
    for (let i = 0; i < heights.length; i++) {
      const shape = 0.45 + 0.55 * Math.abs(Math.sin(i * 0.8 + s.t * (s.calm ? 0 : 5)));
      const want = Math.max(0.08, s.level * shape);
      heights[i] = s.still ? want : heights[i] + (want - heights[i]) * 0.35;
      const h = Math.max(2, heights[i] * 22);
      ctx.beginPath();
      ctx.roundRect(i * 6, 12 - h / 2, 3, h, 1.5);
      ctx.fill();
    }
  });
</script>
</body>
</html>
