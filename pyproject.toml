[project]
name = "jarvis"
version = "1.0.0"
description = "Local-first voice-controlled desktop assistant for Windows 11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Preeyas Tumulu" }]
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "rapidfuzz>=3.9",
    "ddgs>=9.0",
    "pypdf>=6.20.1",
    "httpx>=0.28.1",
    "yfinance>=1.7.0",
    "trafilatura>=2.3.1",
    "pycaw>=20260927",
    "mss>=10.2.0",
    "fastapi>=0.143.1",
    "uvicorn>=0.54.0",
    "playwright>=1.64.0",
    "winrt-runtime>=3.2.1",
    "winrt-windows-ui-notifications-management>=3.2.1",
    "winrt-windows-ui-notifications>=3.2.1",
    "winrt-windows-foundation>=3.2.1",
    "winrt-windows-foundation-collections>=3.2.1",
    "winrt-windows-data-xml-dom>=3.2.1",
    "winrt-windows-applicationmodel>=3.2.1",
    "pystray>=0.19.5",
    "pillow>=13.0.0",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.2.1",
    "numpy>=2.4.6",
    "openwakeword>=0.6.0",
    "sounddevice>=0.5.6",
]
piper = [
    "piper-tts>=1.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
# The Microsoft Store Python sandboxes AppData writes, which hides Jarvis's data folder.
# uv's own Python builds behave like a normal install. See docs/DECISIONS.md ADR-019.
python-preference = "only-managed"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.format]
exclude = ["*.md"]  # keep hand-aligned pseudo-code in docs as written

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["jarvis"]

[[tool.mypy.overrides]]
module = [
    "ddgs", "ddgs.*", "faster_whisper", "openwakeword.*", "sounddevice", "piper", "piper.*",
    "yfinance", "yfinance.*", "pycaw", "pycaw.*", "comtypes", "comtypes.*", "pystray",
    "pystray.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "llm: needs a running Ollama with the Jarvis models (run with -m llm)",
    "browser: needs Playwright's Chromium (uv run playwright install chromium; run with -m browser)",
]
addopts = "-m 'not llm and not browser'"

[tool.coverage.run]
source = ["jarvis"]
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
